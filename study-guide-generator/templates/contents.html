<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root {
  --deck-deep:     #9E6474;
  --deck-deep-tab: #B98292;
  --deck-accent:     #D98F98;
  --deck-key-msg:  #635054;
  --deck-footnote: #B29AA0;
  --deck-card-head:#F8EDEF;
  --slate-200:     #F0DFE2;
  --slate-100:     #FBF2F3;
  --ink-700:       #5F4E53;
  --ink-500:       #9E838B;
  --font-deck:     'Montserrat', 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

html, body { margin: 0; }

.slide {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: #fff; color: var(--ink-700); font-family: var(--font-deck);
  padding: 42px 64px 52px; box-sizing: border-box;
  display: flex; flex-direction: column;
}

/* ─── Locked chrome ─────────────────────────── */
.tab {
  position: absolute; left: 0; top: 46px;
  width: 30px; height: 36px;
  background: var(--deck-deep-tab); border-radius: 0 6px 6px 0;
}
.logo { position: absolute; left: 1127px; top: 27px; z-index: 3; }
.logo img { width: 120px; height: 40px; display: block; }

h1 {
  margin: 0;
  font-family: var(--font-deck);
  font-weight: 700; font-size: 26px;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--deck-deep);
}

.hr {
  margin: 18px 0 0;
  height: 1px; background: var(--slate-200);
  flex-shrink: 0;
}

/* ─── Content zone ──────────────────────────── */
.content-zone {
  margin-top: 22px; flex: 1; min-height: 0; overflow: hidden;
}

/* ─── Numbered list - primary style ─────────── */
ol.agenda {
  margin: 0; padding: 0;
  list-style: none;
  counter-reset: agenda-counter;
}
ol.agenda > li {
  counter-increment: agenda-counter;
  position: relative;
  padding-left: 36px;
  margin-bottom: 18px;
  font-size: 15px; line-height: 1.55;
  color: var(--ink-700);
}
ol.agenda > li::before {
  /* No trailing period on the numeral. The reference slide sets a bare
     "1", and a period reads as a sentence marker on a list whose items
     are labels rather than sentences. */
  content: counter(agenda-counter);
  position: absolute; left: 0;
  font-weight: 700; color: var(--deck-deep);
  width: 28px;
}
ol.agenda > li b {
  color: var(--deck-deep); font-weight: 700;
}

/* Each item is a fixed bold navy LABEL, an em dash, then the VALUE.
   The value is set lighter than the label so the eye reads down the
   labels first and across to a value only where it wants one. Without
   this the two sit at the same weight of grey and the list reads as
   undifferentiated prose. */
.val { color: var(--deck-footnote); }

/* Sub-list (a, b, c) */
ol.sub {
  margin: 10px 0 0; padding: 0;
  list-style: none;
  counter-reset: sub-counter;
}
ol.sub > li {
  counter-increment: sub-counter;
  position: relative;
  padding-left: 36px;
  margin-bottom: 10px;
  font-size: 14px; line-height: 1.5;
  color: var(--ink-700);
}
ol.sub > li::before {
  /* Bare letter, bold navy, matching the parent numerals. */
  content: counter(sub-counter, lower-alpha);
  position: absolute; left: 8px;
  font-weight: 700; color: var(--deck-deep);
}

/* ─── Footer ────────────────────────────────── */
.footnote {
  /* Footnote lane - in normal flow, never an overlay.
  
     This block is a flex sibling of the content wrapper inside .slide,
     with flex-shrink: 0, so the content zone can only ever use the
     height left over once this lane has taken its own. Every template
     in this library previously declared it `position: absolute;
     bottom: 44px` while the content wrapper ran `flex: 1` all the way
     down to the slide's bottom padding. That put both in the same
     vertical band with nothing reserving the lane, and any slide whose
     content reached the bottom rendered straight through its own
     footnotes. That is not a density-estimate failure that a better
     heuristic would have caught: the two boxes were laid out
     independently and could not see each other. mastery-heatmap.html
     already did it this way and is the only template that never
     exhibited the collision, which is what identified the pattern.
  
     max-height caps the lane at roughly five lines so a long footnote
     cannot take the slide over instead. Nothing here is allowed to be
     clipped silently: verify_render.py measures the real rendered
     geometry of every slide and fails it rather than shipping content
     that is present in the markup but invisible on the canvas. */
  flex-shrink: 0; margin-top: 12px;
  /* overflow: hidden is what makes max-height a real cap rather
     than a suggestion. Without it the lane simply grows past the
     cap and paints over the footer bar, which is the same defect
     this whole change set exists to remove, moved down 40px.
     With it, an oversized footnote block is caught as clipped
     content by verify_render.py, which then steps the footnote
     type down until every note fits. */
  overflow: hidden;
  max-height: 74px;
  font-size: 10px; color: var(--deck-footnote); line-height: 1.4;
}
.footer-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 38px; background: var(--deck-deep);
  border-top: 2px solid var(--deck-accent);
  display: flex; align-items: center; padding: 0 56px; justify-content: space-between;
}
.footer-label { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.82); }
.footer-pg { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .05em; }
</style>
</head>
<body>
  <div class="slide">

    <!-- LOCKED CHROME -->
    <span class="tab"></span>
    <div class="logo">
</div>
    <h1>{{ title }}</h1>
    <div class="hr"></div>
    <!-- END LOCKED CHROME -->

    <!-- CONTENT ZONE -->
    <div class="content-zone">
      {{ content_html | safe }}
    </div>
    <!-- END CONTENT ZONE -->

    <!-- LOCKED CHROME -->
    {% if footnote %}
    <div class="footnote">{{ footnote }}</div>
    {% endif %}
    <div class="footer-bar">
      <span class="footer-label">Study Guide</span>
      <span class="footer-pg">{{ page_number }}</span>
    </div>
    <!-- END LOCKED CHROME -->

  </div>
</body>
</html>
