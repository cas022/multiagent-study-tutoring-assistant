<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root {
  --deck-deep: #9E6474;
  --deck-accent: #D98F98;
  --font-deck: 'Montserrat', 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

html, body { margin: 0; }

.slide {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: var(--deck-deep); color: #fff; font-family: var(--font-deck);
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 72px; box-sizing: border-box;
}

/* Faint infrastructure photo - right half, desaturated */
.photo {
  position: absolute; inset: 0;
  background-image: linear-gradient(135deg, #D98F98 0%, #E2B7B9 55%, #A1C9D0 100%);
  background-position: right center;
  background-size: 60%;
  background-repeat: no-repeat;
  filter: grayscale(1); opacity: .16;
}

/* Gradient veil - full navy on left, fades right */
.veil {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--deck-deep) 32%, rgba(158,100,116,.35) 100%);
}

/* Main content block */
.inner {
  position: relative; z-index: 2; max-width: 760px;
}

/* Gold section number + horizontal bar */
.idx {
  display: flex; align-items: center; gap: 20px; margin-bottom: 26px;
}
.idx .n {
  font-weight: 800; font-size: 30px;
  color: var(--deck-accent); letter-spacing: .02em;
}
.idx .bar {
  width: 64px; height: 2px; background: var(--deck-accent);
}

/* Eyebrow label */
.eyebrow {
  margin: 0 0 16px;
  font-weight: 600; font-size: 13px;
  letter-spacing: .26em; text-transform: uppercase;
  color: rgba(255,255,255,.62);
}

/* Section title */
h1 {
  margin: 0;
  font-family: var(--font-deck);
  font-weight: 800; font-size: 56px;
  line-height: 1.06; letter-spacing: .01em;
  text-transform: uppercase; color: #fff;
}

/* Lead paragraph */
.lede {
  margin: 26px 0 0;
  font-weight: 400; font-size: 18px;
  line-height: 1.6; color: rgba(255,255,255,.78);
  max-width: 56ch;
}

/* Logo - top-right, white version */
.logo {
  position: absolute; right: 64px; top: 52px;
  z-index: 2;
}
.logo img { height: 36px; display: block; opacity: .9; }

/* Page number - bottom-left, subtle */
.pg {
  position: absolute; left: 72px; bottom: 54px;
  z-index: 2;
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,.4); letter-spacing: .1em;
}
</style>
</head>
<body>
  <div class="slide">
    <div class="photo"></div>
    <div class="veil"></div>

    <div class="inner">
      <div class="idx">
        <span class="n">{{ section_number }}</span>
        <span class="bar"></span>
      </div>
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      {% if lede %}
      <p class="lede">{{ lede }}</p>
      {% endif %}
    </div>

    <div class="logo">
</div>

    <span class="pg">{{ page_number }}</span>
  </div>
</body>
</html>
